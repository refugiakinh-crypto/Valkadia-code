      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      background: rgba(216, 0, 255, 0.08);

    let currentCategory = 'ALL';
    let currentSearchTerm = '';

    function renderCodes() {
      const grid = document.getElementById('codesGrid');
      const counter = document.getElementById('codeCounter');
      grid.innerHTML = '';

      const filtered = codesData.filter(item => {
        const matchesCategory = (currentCategory === 'ALL') || (item.type === currentCategory);
        const matchesSearch = item.code.toLowerCase().includes(currentSearchTerm.toLowerCase()) || 
                              item.desc.toLowerCase().includes(currentSearchTerm.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      counter.textContent = `TOTAL CODES DISPLAYED: ${filtered.length}`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="no-results"><i class="fa-solid fa-ghost" style="font-size: 2rem; margin-bottom: 10px;"></i><br>No codes found matching "${currentSearchTerm}"</div>`;
        return;
      }

      filtered.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'code-card';
        card.style.animationDelay = `${(index % 12) * 0.04}s`;

        card.innerHTML = `
          <div class="code-info">
            <span class="code-tag">${item.type} CODE</span>
            <div class="code-text">${escapeHtml(item.code)}</div>
            <div class="code-desc">${escapeHtml(item.desc)}</div>
          </div>
          <button class="copy-btn" onclick="copyCode('${escapeHtml(item.code)}', this)">
            <i class="fa-regular fa-copy"></i>
            <span>COPY CODE</span>
          </button>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    function copyCode(textToCopy, btnElement) {
      const cleanText = textToCopy.replace(/\\'/g, "'");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(cleanText).then(() => {
          showSuccessState(btnElement, cleanText);
        }).catch(() => {
          fallbackCopy(cleanText, btnElement);
        });
      } else {
        fallbackCopy(cleanText, btnElement);
      }
    }

    function fallbackCopy(text, btnElement) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      try {
        document.execCommand('copy');
        showSuccessState(btnElement, text);
      } catch (err) {
        showToast('Failed to copy code automatically');
      }
      document.body.removeChild(textarea);
    }

    function showSuccessState(btn, text) {
      const originalHTML = btn.innerHTML;
      btn.classList.add('copied');
      btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>COPIED!</span>`;

      showToast(`Copied: ${text}`);

      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = originalHTML;
      }, 2000);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearchTerm = e.target.value.trim();
      renderCodes();
    });

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCodes();
    }

    /* Particle Canvas System */
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const particleCount = 65;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1;
        this.speedY = -(Math.random() * 1.2 + 0.3);
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.opacity = Math.random() * 0.7 + 0.2;
        this.color = Math.random() > 0.5 ? '#b026ff' : '#00ffff';
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;

        if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - this.size * 2);
        ctx.lineTo(this.x + this.size, this.y);
        ctx.lineTo(this.x, this.y + this.size * 2);
        ctx.lineTo(this.x - this.size, this.y);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    /* Floating Rune Background Generator */
    const runeSymbols = ['⚔', '🔮', '⚡', '👑', '✦', '✧', '★', '✵', '❖'];
    const runeContainer = document.getElementById('rune-container');

    for (let i = 0; i < 15; i++) {
      const rune = document.createElement('div');
      rune.className = 'rune';
      rune.textContent = runeSymbols[Math.floor(Math.random() * runeSymbols.length)];
      rune.style.left = `${Math.random() * 100}%`;
      rune.style.animationDuration = `${8 + Math.random() * 10}s`;
      rune.style.animationDelay = `${Math.random() * 5}s`;
      runeContainer.appendChild(rune);
    }

    renderCodes();
  </script>
</body>
</html>
